<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Learning Leaflet.js</title>
        <link rel="stylesheet" href="styles/style.css">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    </head>

    <body>

        <main>
            <div id="map">

            </div>
        </main>

        <script src="scripts/script.js"></script>

        <script>
            const latitudeLongitude = [28.6139, 77.2090];
            // 1. Use the Leaflet.js map function to go to id: #map it sets the camera 
            //    at the given latitude and longitude with the initial zoom level
            const map = L.map('map').setView(latitudeLongitude, 12);

            // 2. This gets the actual map from OpenStreetMap Server and 
            //    attaches it to the map object. {s} allows leaflet to dynamically go to 
            //    the different servers of the OSM to ensure no lag happens should not **PLACE BY OURSELVES**
            //    {z} tells the maxZoom and {x} and {y} are generated by the leaflet to tell how many tiles are actually 
            //    required by our project.
            L.tileLayer(`https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png`, {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);


            // 3. The Marker Object is added on the latitude and longitude and added to map
            //    Then we add the BindPopUp when Clicked on said marker. 
            const marker = L.marker(latitudeLongitude).addTo(map);
            marker.bindPopup("<b>New Delhi</b><br/>Capital of India.");

            // 4. How to add multiple markers for locations
            const locations = [
                { name: "India Gate", lat: 28.6129, lng: 77.2295 },
                { name: "Red Fort", lat: 28.6562, lng: 77.2410 },
                { name: "Qutub Minar", lat: 28.5244, lng: 77.1855 }
            ];
            locations.forEach(loc => {
                L.marker([loc.lat, loc.lng]).addTo(map).bindPopup(`<b>${loc.name}</b>`)
            })

            /* *******************************************************
                                    Work with GEO JSON
               ******************************************************* */

            const geoData = {
                type: 'Feature',
                "geometry": {
                    type: "Polygon",
                    coordinates: [
                        [
                            [77.21, 28.65],
                            [77.25, 28.65],
                            [77.25, 28.62],
                            [77.21, 28.62],
                            [77.21, 28.65]
                        ]
                    ]
                },
            };

            L.geoJSON(geoData, { style: { color: "red", weight: 2 } }).addTo(map)

            map.on('click', function (e) {
                L.marker(e.latlng).addTo(map);
                console.log('Clicked At:', e.latlng);
            })

            const customIcon = L.icon({
                iconUrl: `images/icon.png`,
                iconSize: [40, 40],
            })

            L.marker(
                [28.90, 77.21],
                { icon: customIcon }
            ).addTo(map);

            // So LayerGroup allows me to put layers on a map so I can place markers or highlight the place 
            const markers = L.layerGroup();
            const polygons = L.layerGroup();

            L.marker([28.61, 77.23]).addTo(markers);
            L.circle([28.62, 77.22], { radius: 500 }).addTo(polygons);

            const overlayMaps = {
                "Markers": markers,
                "Polygons": polygons,
            };

            L.control.layers(null, overlayMaps).addTo(map)

        </script>
    </body>

</html>
